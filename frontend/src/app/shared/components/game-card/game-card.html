<article class="flex flex-col gap-2">
  <div
    class="relative flex flex-col items-center justify-center h-56.25 w-37.5 border border-surface rounded-lg transition duration-100 ease-in-out hover:scale-110 hover:-translate-y-4 hover:border-accent cursor-pointer"
  >
    <span
      class="absolute left-2 top-1 text-label bg-bg-deep/80 text-sm rounded-sm px-2 truncate max-w-[calc(100%-1rem)]"
      >{{ gameType() }}</span
    >
    @if (cover(); as cover) {
      <img [src]="cover" [alt]="name()" class="flex-1 rounded-lg" />
    } @else {
      <img src="/icons/image.svg" [alt]="name()" height="24" width="24" />
    }
  </div>
  <div class="flex flex-col gap-1">
    <p class="text-fg-strong text-sm">{{ name() }}</p>
    <span class="text-fg-muted text-xs">{{ releaseYear() }}</span>
  </div>
</article>
