spring.config.import=file:.env[.properties]

spring.application.name=platinado
server.port=${PORT:8080}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}?sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=${DB_ALLOW_PUBKEY:true}&serverTimezone=${TZ:UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.connect-retries=${FLYWAY_CONNECT_RETRIES:15}
spring.flyway.connect-retries-interval=2s

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=${TZ:UTC}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

storage.endpoint=${S3_ENDPOINT}
storage.access-key=${S3_ACCESS_KEY}
storage.secret-key=${S3_SECRET_KEY}
storage.bucket=${S3_BUCKET}
